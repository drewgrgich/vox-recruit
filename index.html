html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::after{content:"";pointer-events:none;position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);z-index:50}
.aur{font-family:"AurebeshNL",monospace;letter-spacing:.06em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d1620 70%,rgba(5,8,13,.96));border-bottom:1px solid var(--line)}
.hd{max-width:560px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:12px}
.hd .logo{width:40px;height:40px;color:var(--amber);flex:none}
.hd .t{flex:1;min-width:0}
.hd .t b{display:block;font-size:13px;letter-spacing:.18em;color:var(--amber);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .t span{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-top:3px}
.chip{font-size:11px;letter-spacing:.08em;color:var(--cyan);border:1px solid var(--cyan-dim);border-radius:3px;padding:5px 7px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.pips{max-width:560px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px}
.pips i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--amber)}
.pips i.done{background:var(--green)}

h1{font-size:20px;letter-spacing:.2em;color:var(--amber);margin:22px 0 4px;font-weight:700}
.kicker{font-size:11px;letter-spacing:.22em;color:var(--muted);margin-top:20px}
.kicker+h1{margin-top:4px}
p{line-height:1.55}
.comm{margin:14px 0;border:1px solid var(--line);border-left:3px solid var(--cyan);background:var(--panel);border-radius:4px;padding:12px 14px}
.comm .who{font-size:11px;letter-spacing:.2em;color:var(--cyan);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.comm .who em{font-style:normal;color:var(--muted)}
.comm p{margin:.45em 0;font-size:15px}
.comm p b{color:var(--amber);font-weight:700}
.comm.ok{border-left-color:var(--green)}
.comm.ok .who{color:var(--green)}
.comm .line{margin:.7em 0;font-size:15px;line-height:1.5}
.comm .line span{color:var(--cyan);font-size:12px;letter-spacing:.14em;display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin:14px 0}
.panel h2{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:0 0 10px;font-weight:700}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}

button{font:700 15px var(--mono);letter-spacing:.16em;padding:15px 18px;background:transparent;color:var(--amber);border:1px solid var(--amber);border-radius:4px;cursor:pointer;touch-action:manipulation}
button:active{background:rgba(255,179,71,.15)}
button:disabled{opacity:.4}
button.full{width:100%}
button.ghost{color:var(--muted);border-color:var(--line);font-size:13px;padding:12px 14px}
button.go{color:#04130a;background:var(--green);border-color:var(--green)}
.row{display:flex;gap:10px;align-items:center;margin-top:12px}
.row>*{flex:1}
input.txt{width:100%;height:56px;font:700 22px var(--mono);letter-spacing:.14em;text-align:center;color:#fff;background:#060b12;border:1px solid var(--line);border-bottom:2px solid var(--cyan-dim);border-radius:4px;outline:none;text-transform:uppercase;caret-color:var(--cyan)}
input.txt:focus{border-color:var(--cyan)}
.fb{min-height:22px;font-size:14px;margin-top:10px;line-height:1.45}
.fb.bad{color:var(--red)}.fb.ok{color:var(--green)}.fb.warn{color:var(--amber)}
.hint{margin-top:10px;border:1px dashed var(--amber-dim);border-radius:4px;padding:10px 12px;font-size:14px;line-height:1.5;color:var(--text);display:none}
.hint.on{display:block}
.hint .hl{color:var(--amber);font-size:11px;letter-spacing:.18em;display:block;margin-bottom:3px;font-weight:700}
.hint b{color:var(--amber)}
.hint+.hint{margin-top:8px}

/* manifest */
.crate{border-top:1px solid var(--line);padding:10px 2px}
.crate:first-of-type{border-top:0;padding-top:2px}
.crate .id{color:var(--cyan);font-weight:700;font-size:14px;letter-spacing:.1em}
.crate .f{display:grid;grid-template-columns:86px 1fr;align-items:baseline;gap:8px;margin-top:6px}
.crate .f small{font-size:10px;letter-spacing:.14em;color:var(--muted)}
.crate .aur{color:var(--amber);font-size:22px;line-height:1.3;word-spacing:.35em}
.crate .aur span{white-space:nowrap}
.alpha{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.alpha>div{text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 0 6px;background:var(--panel2)}
.alpha .g{font-family:"AurebeshNL",monospace;font-size:24px;color:var(--amber);line-height:1}
.alpha .l{font-size:14px;color:#fff;margin-top:4px;font-weight:700}

/* drift */
.cipher{font-size:16px;line-height:1.75;letter-spacing:.12em;color:#fff;word-spacing:.2em;background:#060b12;border:1px solid var(--line);border-radius:4px;padding:12px}
.cipher .hl{color:var(--amber);font-weight:700}
.strip{display:grid;grid-template-columns:44px repeat(13,1fr);gap:2px;font-size:14px;text-align:center;margin-top:6px}
.strip .lab{font-size:9px;letter-spacing:.08em;color:var(--muted);text-align:left;display:flex;align-items:center}
.strip .p{color:#fff;background:#0f1924;padding:6px 0;border-radius:2px;font-weight:700}
.strip .c{color:var(--amber);background:#1a1307;padding:6px 0;border-radius:2px;font-weight:700}
.strip .c.hit{background:var(--amber);color:#000;box-shadow:0 0 0 2px #fff inset}
.strip .sp{grid-column:1/-1;height:6px}
.dial{display:flex;align-items:center;gap:10px;margin-top:12px}
.dial button{flex:none;width:52px;padding:12px 0;font-size:20px}
.dial input[type=range]{flex:1;accent-color:var(--amber);height:36px}
.dial .v{width:70px;text-align:center;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.dial .v b{display:block;color:var(--amber);font-size:26px;letter-spacing:0}

/* log */
table.duty{width:100%;border-collapse:collapse;font-size:13px}
table.duty td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
table.duty td.n{color:#fff;font-weight:700}
table.duty td.n small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
table.duty td.w{color:var(--cyan);white-space:nowrap;text-align:right}
.log{display:flex;flex-direction:column;gap:6px}
.log button{display:grid;grid-template-columns:52px 1fr;gap:2px 10px;text-align:left;letter-spacing:.04em;font-weight:400;font-size:13px;color:var(--text);border:1px solid var(--line);background:var(--panel2);padding:10px 12px}
.log button .t{color:var(--cyan);font-weight:700;grid-row:span 2}
.log button .d{color:#fff;font-weight:700}
.log button .w{color:var(--muted)}
.log button.sel{border-color:var(--amber);background:#1a1307}
.log button.sel .d{color:var(--amber)}
.log button.hit{border-color:var(--red);background:#2a0d0d}
p.rule{font-size:14px;line-height:1.6;margin:0}
p.rule b{color:var(--amber)}
table.duty td.w .brk{font-size:10px;color:var(--muted);letter-spacing:.1em}
ol.steps{margin:0;padding-left:20px;font-size:14px;line-height:1.55}
ol.steps li{margin:6px 0}
ol.steps b{color:var(--amber)}
.lockout{text-align:center;padding:12px;border:1px solid var(--red);color:var(--red);border-radius:4px;margin-top:10px;font-size:14px;letter-spacing:.08em;display:none}
.lockout.on{display:block}

/* keyed */
.kmsg{display:flex;flex-wrap:wrap;gap:14px 18px}
.kword{display:flex;gap:4px}
.kcell{display:flex;flex-direction:column;align-items:center;width:38px}
.kcell .g{font-family:"AurebeshNL",monospace;font-size:26px;color:var(--amber);line-height:1;height:28px}
.kcell .s{font-size:17px;color:#fff;font-weight:700;margin-top:3px;line-height:1}
.kcell .k{font-size:10px;color:var(--cyan);height:30px;line-height:1.3;text-align:center;margin-top:3px;letter-spacing:.02em}
.kcell .k small{display:block;font-size:10px;color:var(--cyan-dim)}
.klegend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.klegend b{color:#fff}.klegend i{color:var(--cyan);font-style:normal}
.kcell input{width:36px;height:42px;margin-top:3px;text-align:center;font:700 20px var(--mono);color:#fff;background:#060b12;border:1px solid var(--line);border-bottom:2px solid var(--cyan-dim);border-radius:3px;outline:none;text-transform:uppercase;padding:0;caret-color:var(--cyan)}
.kcell input:focus{border-color:var(--amber);box-shadow:0 0 0 2px rgba(255,179,71,.2)}
.kcell.cur .g{text-shadow:0 0 12px rgba(255,179,71,.6)}
.stripbox{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);margin:0 -16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.stripbox .cap{font-size:11px;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between}
.stripbox .cap b{color:var(--amber)}

/* lockbreaker */
.slots{display:flex;gap:10px;justify-content:center;margin:6px 0 12px}
.slot{width:62px;height:72px;border:1px solid var(--line);border-bottom:2px solid var(--cyan-dim);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#060b12}
.slot .g{font-family:"AurebeshNL",monospace;font-size:34px;color:var(--amber);line-height:1}
.slot .l{font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
.slot.next{border-color:var(--amber)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text);border-color:var(--line);background:var(--panel2)}
.pad button .g{font-family:"AurebeshNL",monospace;font-size:30px;color:var(--amber);letter-spacing:0;font-weight:400;line-height:1}
.pad button .l{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.pad button.used{opacity:.3}
.tries{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.try{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:6px 10px;background:var(--panel2)}
.try .gs{font-family:"AurebeshNL",monospace;font-size:24px;color:var(--amber);letter-spacing:.3em;flex:none}
.try .gl{font-size:10px;color:var(--muted);flex:1;letter-spacing:.06em}
.try .sc{font-size:13px;white-space:nowrap;text-align:right}
.try .sc b{color:var(--green)} .try .sc i{color:var(--amber);font-style:normal}
.meter{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;color:var(--muted);margin:2px 0 8px}
.meter b{color:var(--amber)}

/* intel + final */
details.intel{margin:16px 0;border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
details.intel summary{padding:12px 14px;font-size:11px;letter-spacing:.2em;color:var(--cyan);cursor:pointer;list-style:none}
details.intel summary::-webkit-details-marker{display:none}
details.intel ul{margin:0;padding:0 14px 12px 30px;font-size:13px;line-height:1.7}
details.intel li b{color:var(--amber)}
.granted{text-align:center;padding:10px 0}
.granted .aur{font-size:34px;color:var(--green);line-height:1.15;text-shadow:0 0 22px rgba(93,255,154,.35)}
.granted h1{color:var(--green);text-align:center;margin-top:8px}
.codebox{margin:18px auto 6px;border:2px dashed var(--green);border-radius:6px;padding:16px 8px;text-align:center}
.codebox small{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.codebox .code{font-size:40px;letter-spacing:.14em;color:#fff;font-weight:700;margin:6px 0 4px}
.codebox .ser{font-size:15px;letter-spacing:.14em;color:var(--cyan)}
.stamp{font-size:12px;color:var(--muted);letter-spacing:.1em;text-align:center}
.center{text-align:center}
.blink::after{content:"▮";animation:bl 1s steps(1) infinite;color:var(--cyan);margin-left:2px}
@keyframes bl{50%{opacity:0}}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.blink::after{animation:none}}
@media (max-width:400px){.hd .t b{font-size:12px;letter-spacing:.1em}.hd .t span{letter-spacing:.08em}.chip{font-size:10px;padding:4px 5px}}
@media (max-width:370px){.kcell{width:33px}.kcell input{width:31px}.strip{grid-template-columns:36px repeat(13,1fr);font-size:12px}}
</style>
</head>

    <span class="chip" id="chip" title="Recruit card">NO CARD</span>
  </div>
  <div class="pips" id="pips"><i></i><i></i><i></i><i></i><i></i></div>
</header>
<main class="wrap" id="app"></main>

<script src="core.js"></script>
<script>
(function(){
"use strict";
var V = window.VOX, $ = function(s,el){return (el||document).querySelector(s);}, app = $("#app");
var STAGES = ["manifest","drift","log","keyed","lock"];
var serial = null, P = null, S = null, timers = [];

/* ---------- storage (falls back to memory) ---------- */
var mem = {};
function load(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return mem[k]||null; } }
function store(k,v){ mem[k]=v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function save(){ store("vox-recruit:"+serial, S); }

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function clearTimers(){ timers.forEach(clearInterval); timers=[]; }
function comm(who, role, html, cls){ return '<div class="comm fade '+(cls||"")+'"><div class="who"><span>'+who+'</span><em>'+(role||"")+'</em></div>'+html+'</div>'; }
function hintBlock(id){ return '<div class="hint" id="'+id+'1"></div><div class="hint" id="'+id+'2"></div>'; }
function pips(){
  var cur = S && S.stage;
  [].forEach.call($("#pips").children, function(p,i){
    p.className = (S && S.solved[STAGES[i]]) ? "done" : (STAGES[i]===cur ? "on" : "");
  });
}
function intel(){
  var items = [];
  if (S.solved.manifest) items.push('Off-route crate <b>'+P.manifest.crate+'</b> → '+P.manifest.offRoute+': <b>'+P.manifest.answer+'</b>');
  if (S.solved.drift) items.push('Croy\'s drift: <b>'+P.drift.shift+'</b> · auth word <b>'+P.drift.answer+'</b>');
  if (S.solved.log) items.push('Cloned credential: <b>'+P.log.answer+'</b> (your key for Zorin\'s lock)');
  if (S.solved.keyed) items.push('Lock intel: <b>'+P.keyed.plain+'</b>  <span class="aur" style="color:var(--amber)">'+P.lock.first+'</span>');
  if (!items.length) return "";
  return '<details class="intel"'+(S.stage==="keyed"||S.stage==="lock"?" open":"")+'><summary>▸ DATAPAD · RECOVERED INTEL ('+items.length+')</summary><ul><li>'+items.join("</li><li>")+'</li></ul></details>';
}
function wireHints(stage, list){
  var b = $("#hintBtn");
  function show(){
    var n = S.hints[stage]||0;
    for (var i=1;i<=2;i++){ var el=$("#h"+i); if (i<=n){ el.className="hint on"; el.innerHTML="<span class=\"hl\">HINT "+i+"</span>"+list[i-1]; } }
    b.textContent = n>=2 ? "NO MORE HINTS — FIND A VOX RECRUITER" : (n===1 ? "ANOTHER HINT" : "REQUEST A HINT");
    b.disabled = n>=2;
  }
  b.onclick = function(){ S.hints[stage]=Math.min(2,(S.hints[stage]||0)+1); save(); show(); };
  show();
}
function solvedAndNext(stage, html){
  S.solved[stage] = Date.now();
  var idx = STAGES.indexOf(stage);
  S.stage = STAGES[idx+1] || "done";
  if (S.stage === "done") S.finishedAt = Date.now();
  save(); pips();
  var box = $("#after"); box.innerHTML = html + '<button class="full go" id="nextBtn" style="margin-top:6px">'+(S.stage==="done"?"OPEN THE CHANNEL ▸":"NEXT TEST ▸")+'</button>';
  box.scrollIntoView({behavior:"smooth", block:"start"});
  $("#nextBtn").onclick = function(){ render(); window.scrollTo(0,0); };
}

/* ---------- Aurebesh / strip helpers ---------- */
function aur(s){ return '<span class="aur">'+esc(s)+'</span>'; }
function stripHTML(k, hit){
  var L = V.LETTERS, h = "";
  [0,13].forEach(function(o, blk){
    if (blk) h += '<div class="sp"></div>';
    h += '<div class="lab">CLEAN</div>';
    for (var i=o;i<o+13;i++) h += '<div class="p">'+L[i]+'</div>';
    h += '<div class="lab">CODED</div>';
    for (i=o;i<o+13;i++){ var cc = V.shiftChar(L[i],k); h += '<div class="c'+(cc===hit?' hit':'')+'">'+cc+'</div>'; }
  });
  return '<div class="strip">'+h+'</div>';
}

/* ---------- screens ---------- */
function render(){
  clearTimers(); pips();
  if (!serial) return intake();
  var st = S.stage;
  if (st === "brief") return brief();
  if (st === "done") return finale();
  ({manifest:stManifest, drift:stDrift, log:stLog, keyed:stKeyed, lock:stLock})[st]();
}

function intake(msg){
  $("#chip").textContent = "NO CARD";
  app.innerHTML =
    '<div class="kicker">RECRUITMENT CHANNEL</div><h1>CARD REQUIRED</h1>'+
    comm("VOX BINARY DATAWORX","AUTOMATED",
      '<p>This channel opens for card-holders only. Scan the code on your <b>Vox recruit card</b>, or type the serial printed on it.</p>'+
      '<p style="color:var(--muted);font-size:13px">No card? Then nobody\'s recruited you yet. Find one of us aboard. If we think you\'ve got it, we\'ll find you.</p>')+
    '<div class="panel"><h2>CARD SERIAL</h2><input class="txt" id="ser" placeholder="VBD-XXXX-X" autocomplete="off" autocapitalize="characters" spellcheck="false">'+
    '<div class="fb bad" id="fb">'+(msg||"")+'</div><button class="full" id="go" style="margin-top:8px">OPEN CHANNEL ▸</button></div>';
  function go(){
    var s = V.normSerial($("#ser").value);
    if (!s){ $("#fb").textContent = "That serial doesn't check out. Look again: it starts with VBD and has five characters after it."; return; }
    location.hash = s;
  }
  $("#go").onclick = go;
  $("#ser").onkeydown = function(e){ if (e.key==="Enter") go(); };
}

function brief(){
  app.innerHTML =
    '<div class="kicker">INCOMING · CARD '+serial+'</div><h1>VOX IS HIRING</h1>'+
    comm("ZORIN VOX","DATAWORX",
      '<p>If you\'re reading this, one of us handed you a card. That wasn\'t an accident. We don\'t hand them to just anyone.</p>')+
    comm("AN\'THO VOX","DATAWORX",
      '<p>Five tests. Every one is built from data we skimmed off the starcruiser <b>Halcyon</b> on her 275th voyage, and every one is cut to fit <b>your card alone</b>. Your friends can teach you the trick. They can\'t hand you the answer.</p>')+
    comm("TAYLA THRUNE","RECRUITER",
      '<p>It takes most people 30 to 60 minutes. Your progress saves on this device, so you can stop between missions and come back. Hints are free. Pride costs extra.</p>')+
    comm("I\'AN GRAYSON","RECRUITER",
      '<p>Clear all five and the channel gives you a <b>recruit code</b>. Bring it, along with that card, to <b>Vox Binary Dataworx HQ (Universal F3)</b>. The pay is terrible, citizen. The company is excellent.</p>')+
    '<button class="full" id="go" style="margin-top:8px">BEGIN TEST 1 ▸</button>';
  $("#go").onclick = function(){ S.stage="manifest"; S.startedAt = S.startedAt||Date.now(); save(); render(); window.scrollTo(0,0); };
}

/* ---- 1 · READ THE MANIFEST ---- */
function stManifest(){
  var M = P.manifest;
  function aw(s){ return '<span class="aur">'+s.split(" ").map(function(w){return '<span>'+esc(w)+'</span>';}).join(" ")+'</span>'; }
  var rows = M.crates.map(function(c){ return '<div class="crate"><div class="id">CRATE '+c.id+'</div><div class="f"><small>BOUND FOR</small>'+aw(c.dest)+'</div><div class="f"><small>CONTENTS</small>'+aw(c.cargo)+'</div></div>'; }).join("");
  var chart = V.LETTERS.split("").map(function(l){ return '<div><div class="g">'+l+'</div><div class="l">'+l+'</div></div>'; }).join("");
  app.innerHTML =
    '<div class="kicker">TEST 1 OF 5</div><h1>READ THE MANIFEST</h1>'+
    comm("TAYLA THRUNE","RECRUITER",
      '<p>Hi! Tayla. I\'m the friendly one, so you get me first.</p>'+
      '<p>Back home on Lothal I "helped" with the family shipping business, mostly by making the manifests say whatever was convenient. So trust me: <b>manifests lie</b>.</p>'+
      '<p>This one\'s from the Halcyon\'s cargo hold. Her route was <b>Chandrila, Coruscant, Bespin and Batuu</b>. One crate is bound somewhere else entirely. <b>Tell me what\'s inside it.</b></p>'+
      '<p>It\'s all in Aurebesh. The chart is right below. You\'ve got this.</p>')+
    '<div class="panel"><h2>HALCYON · CARGO HOLD 2 · MANIFEST</h2>'+rows+'</div>'+
    '<div class="panel"><h2>AUREBESH · GLYPH CHART</h2><div class="alpha aur-chart">'+chart+'</div></div>'+
    '<div class="panel" id="work"><h2>CONTENTS OF THE OFF-ROUTE CRATE</h2><input class="txt" id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TYPE IT HERE">'+
    '<div class="fb" id="fb"></div><button class="full" id="chk" style="margin-top:8px">SUBMIT ▸</button>'+hintBlock("h")+
    '<button class="ghost full" id="hintBtn" style="margin-top:10px"></button></div><div id="after"></div>';
  [].forEach.call(document.querySelectorAll(".aur-chart .g"), function(g){ g.classList.add("aur"); });
  wireHints("manifest", [
    'Read each crate\'s <b>BOUND FOR</b> line first. Four of them are Chandrila, Coruscant, Bespin and Batuu. Shortcut: compare each word\'s length and first glyph against those four names.',
    'Your crate is <b>'+M.crate+'</b>, bound for '+M.offRoute+'. Now read its CONTENTS one glyph at a time using the chart.'
  ]);
  function chk(){
    var a = V.letters($("#ans").value), fb = $("#fb");
    if (!a) return;
    var want = V.letters(M.answer);
    if (a === want || (a.length > want.length && a.slice(-want.length) === want && a.slice(0, -want.length).indexOf(V.letters(M.crate)) === 0)){
      fb.className="fb ok"; fb.textContent="✔ MANIFEST READ"; $("#chk").disabled=true; $("#ans").disabled=true;
      solvedAndNext("manifest", comm("TAYLA THRUNE","RECRUITER",
        '<p><b>'+M.answer+'</b>! Off the books and headed for '+M.offRoute+'. Somebody owes somebody a favor.</p><p>Nicely read. I\'m passing you to I\'an. Be nice. He\'ll try to sell you something.</p>',"ok"));
    } else if (M.crates.some(function(c){ return V.letters(c.cargo)===a; })){
      fb.className="fb warn"; fb.textContent="You read that one right, but that crate is on the Halcyon's route. Check where each crate is bound.";
    } else { fb.className="fb bad"; fb.textContent="✖ That's not what's in the crate. Read it again, one glyph at a time."; }
  }
  $("#chk").onclick = chk; $("#ans").onkeydown = function(e){ if (e.key==="Enter") chk(); };
}

/* ---- 2 · DRIFT ---- */
function stDrift(){
  var D = P.drift, k = S.dial||0;
  var parts = D.cipher.split(" / ");
  var shown = parts.map(function(p,i){ return i===parts.length-1 ? '<span class="hl">'+esc(p)+'</span>' : esc(p); }).join(" / ");
  app.innerHTML =
    '<div class="kicker">TEST 2 OF 5</div><h1>DRIFT</h1>'+
    comm("I\'AN GRAYSON","RECRUITER",
      '<p>Greetings, citizen! I\'an Grayson, Junk Traders Outpost, Lothal. I spend my life sorting other people\'s scrap, and the First Order makes a <i>lot</i> of scrap. Most of it is noise on open channels.</p>'+
      '<p>This is a transmission Lt. Croy pushed to his patrols while the Halcyon was underway. Every letter was <b>drifted the same distance</b> down the alphabet. Nobody wrote down the distance. But every First Order transmission opens the same way: <b>FIRST ORDER</b>.</p>'+
      '<p>Find the drift. Then pull out the <b>authorization word</b> at the end (it\'s in amber).</p>')+
    intel()+
    '<div class="panel"><h2>INTERCEPT · FO PATROL CHANNEL</h2><div class="cipher">'+shown+'</div></div>'+
    '<div class="panel"><h2>DRIFT STRIP</h2><div id="strip"></div>'+
    '<div class="dial"><button id="dm" aria-label="drift down">−</button><input type="range" id="rg" min="0" max="25" value="'+k+'" aria-label="drift"><button id="dp" aria-label="drift up">+</button><div class="v">DRIFT<b id="dv">'+k+'</b></div></div>'+
    '<p class="note">With the drift set right, every <b style="color:#fff">CLEAN</b> letter sits above the <b style="color:var(--amber)">CODED</b> letter it became. To decode, find the coded letter on the amber row and read the letter above it.</p></div>'+
    '<div class="panel"><h2>AUTHORIZATION WORD</h2><input class="txt" id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="DECODED WORD">'+
    '<div class="fb" id="fb"></div><button class="full" id="chk" style="margin-top:8px">SUBMIT ▸</button>'+hintBlock("h")+
    '<button class="ghost full" id="hintBtn" style="margin-top:10px"></button></div><div id="after"></div>';
  function setK(n){ k=(n+26)%26; $("#rg").value=k; $("#dv").textContent=k; $("#strip").innerHTML=stripHTML(k); S.dial=k; save(); }
  setK(k);
  $("#rg").oninput = function(){ setK(+this.value); };
  $("#dm").onclick = function(){ setK(k-1); }; $("#dp").onclick = function(){ setK(k+1); };
  wireHints("drift", [
    'The first coded letter is what <b>F</b> became. Slide the strip until the amber letter under <b>F</b> matches it. Then check the next one: does <b>I</b> sit over the second coded letter?',
    'Your drift is <b>'+D.shift+'</b>. Set the strip to '+D.shift+', then take each amber letter of the last word, find it on the CODED row, and write down the CLEAN letter above it.'
  ]);
  function chk(){
    var a = V.letters($("#ans").value), fb=$("#fb");
    if (!a) return;
    // accept ECHELON, AUTH ECHELON, or the whole decoded line ending in AUTH ECHELON
    if (a === D.answer || a.slice(-(D.answer.length+4)) === "AUTH"+D.answer){
      fb.className="fb ok"; fb.textContent="✔ AUTHORIZATION CRACKED"; $("#chk").disabled=true; $("#ans").disabled=true;
      solvedAndNext("drift", '<div class="panel"><h2>FULL DECODE</h2><div class="cipher" style="color:var(--green)">'+esc(D.plain)+'</div></div>'+
        comm("I\'AN GRAYSON","RECRUITER",'<p>AUTH <b>'+D.answer+'</b>. Lovely. Croy never did learn to change his habits.</p><p>Next up is An\'tho. Mind your manners, citizen. He notices <i>everything</i>.</p>',"ok"));
    } else if (a.indexOf("FIRST")===0 || a==="FIRSTORDER"){
      fb.className="fb warn"; fb.textContent="That's the header. Good, it means your drift is right. Now decode the amber word at the end.";
    } else { fb.className="fb bad"; fb.textContent="✖ Authorization rejected. Check your drift against FIRST ORDER first."; }
  }
  $("#chk").onclick = chk; $("#ans").onkeydown = function(e){ if (e.key==="Enter") chk(); };
}

/* ---- 3 · THE FORGED LOG ---- */
function stLog(){
  var L = P.log, sel = null;
  var duty = L.board.map(function(b){ return '<tr><td class="n">'+b.name+'<small>'+b.role+' · '+b.duty+'</small></td><td class="w">'+b.windows.map(function(w){ return V.hhmm(w[0])+'–'+V.hhmm(w[1]); }).join('<br><span class="brk">break</span><br>')+'</td></tr>'; }).join("");
  var names = {}; L.board.forEach(function(b){ names[b.id]=b.name; });
  var rows = L.entries.map(function(e){ return '<button data-n="'+e.n+'"><span class="t">'+V.hhmm(e.t)+'</span><span class="d">'+e.door+'</span><span class="w">credential: '+names[e.who]+'</span></button>'; }).join("");
  app.innerHTML =
    '<div class="kicker">TEST 3 OF 5</div><h1>THE FORGED LOG</h1>'+
    comm("AN\'THO VOX","DATAWORX",
      '<p>An\'tho. Hax, if we get along.</p>'+
      '<p>Somebody on the Halcyon <b>cloned a crew credential</b> and walked through a door they had no business opening. Sloppy. Sloppy gets people caught.</p>'+
      '<p>Below are two records: the <b>duty board</b> (where each crew member had to be, and when) and the <b>door log</b> (which credential opened which door, and when). One door-log entry is fake. Find it, tap it, and flag it.</p>'+
      '<p>Flag the wrong one and ship security sweeps the logs. You\'ll wait. So don\'t guess.</p>')+
    intel()+
    '<div class="panel"><h2>THE RULE</h2><p class="rule">During their duty hours, crew are <b>stuck at their post</b>. Off duty (before, after or on a break) they can go <b>anywhere</b>. So a fake entry is a credential opening <b>a door other than its owner\'s post, while its owner is on duty</b>.</p><p class="note">Exactly one entry breaks the rule. Shift start and end times count as on duty.</p></div>'+
    '<div class="panel"><h2>HALCYON · EVENING DUTY BOARD</h2><table class="duty">'+duty+'</table></div>'+
    '<div class="panel"><h2>SECURITY · DOOR LOG</h2><div class="log" id="log">'+rows+'</div>'+
    '<div class="lockout" id="lo"></div><div class="fb" id="fb"></div><button class="full" id="chk" style="margin-top:8px" disabled>FLAG THIS ENTRY ▸</button>'+hintBlock("h")+
    '<button class="ghost full" id="hintBtn" style="margin-top:10px"></button></div><div id="after"></div>';
  var btns = document.querySelectorAll("#log button");
  [].forEach.call(btns, function(b){ b.onclick = function(){ if (S.solved.log) return; [].forEach.call(btns,function(x){x.classList.remove("sel");}); b.classList.add("sel"); sel=+b.dataset.n; refresh(); }; });
  wireHints("log", [
    'Skip every entry where the door is that person\'s own post. Those can never be fake. For each entry that\'s left, check the time against that person\'s shift, and watch for breaks.',
    'Look closely at the entries between <b>'+V.hhmm(L.window[0])+'</b> and <b>'+V.hhmm(L.window[1])+'</b>.'
  ]);
  function locked(){ return (S.logLockUntil||0) > Date.now(); }
  function refresh(){
    var lo=$("#lo"), b=$("#chk");
    if (locked()){
      var s = Math.ceil((S.logLockUntil-Date.now())/1000);
      lo.className="lockout on"; lo.textContent="⚠ SECURITY SWEEP IN PROGRESS · STAND BY "+s+"s"; b.disabled=true;
    } else { lo.className="lockout"; b.disabled = (sel===null) || !!S.solved.log; }
  }
  timers.push(setInterval(refresh, 500)); refresh();
  $("#chk").onclick = function(){
    if (sel===null || locked()) return;
    var fb=$("#fb");
    if (sel === L.forged){
      var e = L.entries[sel], b = L.board.filter(function(x){return x.id===e.who;})[0];
      document.querySelector('#log button[data-n="'+sel+'"]').classList.add("hit");
      fb.className="fb ok"; fb.textContent="✔ FORGED ENTRY FLAGGED"; $("#chk").disabled=true;
      solvedAndNext("log", comm("AN\'THO VOX","DATAWORX",
        '<p>That\'s <b>'+b.name+'</b>\'s credential opening the '+e.door+' at '+V.hhmm(e.t)+', while '+b.name+' was on duty at the '+b.duty+'. Whoever cloned it didn\'t do their homework.</p>'+
        '<p>Remember that name: <b>'+L.answer+'</b>. You\'ll need it for Zorin\'s lock.</p>',"ok"));
    } else {
      S.logFails=(S.logFails||0)+1; S.logLockUntil = Date.now() + Math.min(90, 15*S.logFails)*1000; save();
      fb.className="fb bad"; fb.textContent="✖ That entry checks out. Security noticed you poking around.";
      refresh();
    }
  };
}

/* ---- 4 · KEYED LOCK ---- */
function stKeyed(){
  var K = P.keyed, cur = 0;
  var words = K.cipher.split(" "), idx = 0, html = "";
  words.forEach(function(w){
    html += '<div class="kword">';
    w.split("").forEach(function(ch){ html += '<div class="kcell" data-i="'+idx+'"><div class="g">'+ch+'</div><div class="s">'+ch+'</div><div class="k"></div><input maxlength="1" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="letter '+(idx+1)+'"></div>'; idx++; });
    html += '</div>';
  });
  var N = idx;
  app.innerHTML =
    '<div class="kicker">TEST 4 OF 5</div><h1>KEYED LOCK</h1>'+
    comm("ZORIN VOX","DATAWORX",
      '<p>Zorin. I built this one.</p>'+
      '<p>Same drift you used with I\'an, with one difference: <b>every letter drifts a different distance</b>. A key word sets the distances. Its letters repeat under the message, and each key letter is a drift: <b>A = 0, B = 1, C = 2</b> … all the way to <b>Z = 25</b>.</p>'+
      '<p>The key is the name An\'tho had you dig out of the log. Type it in. Then work the message letter by letter. <b>Tap any box</b> and the strip at the bottom sets itself to that letter\'s drift and lights up the coded letter. Read the clean letter above it.</p>'+
      '<p>Careful: the key letter only tells you the <b>distance</b>. The letter you decode is the <b>white coded letter</b>.</p>'+
      '<p>I don\'t care how long it takes. I care that you finish.</p>')+
    intel()+
    '<div class="panel"><h2>KEY</h2><input class="txt" id="key" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="TYPE THE KEY"></div>'+
    '<div class="panel"><h2>LOCKED MESSAGE</h2><div class="klegend"><span><b>WHITE</b> = coded letter (decode this)</span><span><i>key +N</i> = how far it drifted</span></div><div class="kmsg" id="msg">'+html+'</div>'+
    '<div class="fb" id="fb"></div><button class="full" id="chk" style="margin-top:8px">DECODE ▸</button>'+hintBlock("h")+
    '<button class="ghost full" id="hintBtn" style="margin-top:10px"></button></div><div id="after"></div>'+
    '<div class="stripbox" id="sb"><div class="cap"><span id="cap">TAP A LETTER BOX</span><span>DRIFT <b id="dk">–</b></span></div><div id="strip"></div></div>';
  [].forEach.call(document.querySelectorAll(".kcell .g"), function(g){ g.classList.add("aur"); });
  var cells = document.querySelectorAll(".kcell"), inputs = document.querySelectorAll(".kcell input");
  var keyIn = $("#key");
  keyIn.value = S.keyTyped || "";
  if (S.keyDraft) [].forEach.call(inputs, function(inp,i){ inp.value = S.keyDraft[i]||""; });
  function key(){ return V.letters(keyIn.value); }
  function kAt(i){ var k=key(); return k ? V.LETTERS.indexOf(k[i%k.length]) : -1; }
  function paint(){
    var k = key();
    [].forEach.call(cells, function(c,i){ var d = c.querySelector(".k"); d.innerHTML = k ? 'key '+k[i%k.length]+'<small>+'+kAt(i)+'</small>' : ""; });
    focusCell(cur, true);
  }
  function focusCell(i, noFocus){
    cur = i;
    [].forEach.call(cells, function(c,j){ c.classList.toggle("cur", j===i); });
    var kk = kAt(i);
    var coded = K.cipher.replace(/[^A-Z]/g,"")[i];
    $("#cap").textContent = kk<0 ? "TYPE THE KEY FIRST" : "FIND CODED "+coded+" ON THE AMBER ROW";
    $("#dk").textContent = kk<0 ? "–" : kk;
    $("#strip").innerHTML = stripHTML(kk<0?0:kk, kk<0?null:coded);
    if (!noFocus) inputs[i].focus();
  }
  function draft(){ S.keyDraft = [].map.call(inputs, function(x){ return x.value.toUpperCase(); }); save(); }
  keyIn.oninput = function(){ S.keyTyped = keyIn.value; save(); paint(); };
  [].forEach.call(inputs, function(inp,i){
    inp.onfocus = function(){ focusCell(i, true); };
    inp.oninput = function(){ inp.value = V.letters(inp.value).slice(-1); draft(); if (inp.value && i<N-1) inputs[i+1].focus(); };
    inp.onkeydown = function(e){ if (e.key==="Backspace" && !inp.value && i>0){ inputs[i-1].focus(); } if (e.key==="Enter") chk(); };
  });
  paint();
  wireHints("keyed", [
    'Key = the cloned credential from The Forged Log (it\'s in your Datapad above). Under each glyph is its white coded letter, then the blue key letter and drift. Decode the <b>white</b> letter, not the key letter. If everything comes out as A, you\'re looking up the key letter. Tap a box, find the lit-up letter on the CODED row, and read the CLEAN letter above it.',
    'Key: <b>'+K.key+'</b>. The first word decodes to <b>'+K.plain.split(" ")[0]+'</b>, and the message is about the lock you\'ll face next.'
  ]);
  function chk(){
    var fb=$("#fb"), got = [].map.call(inputs, function(x){ return x.value.toUpperCase()||"·"; }).join("");
    if (key() !== K.key){ fb.className="fb bad"; fb.textContent = key() ? "✖ Wrong key. Zorin's lock wants the name from the Forged Log." : "Type the key first."; return; }
    var want = K.answer, wrong = 0;
    for (var i=0;i<want.length;i++) if (got[i]!==want[i]) wrong++;
    if (!wrong){
      fb.className="fb ok"; fb.textContent="✔ LOCK OPEN"; $("#chk").disabled=true;
      [].forEach.call(inputs, function(x){ x.disabled=true; });
      $("#sb").style.display="none";
      solvedAndNext("keyed", comm("ZORIN VOX","DATAWORX",
        '<p><b>'+K.plain+'</b>.</p><p>Good. That\'s <span class="aur" style="color:var(--amber);font-size:20px">'+P.lock.first+'</span>, '+V.AUREBESH[V.LETTERS.indexOf(P.lock.first)]+'. Hold on to it. One more door, and it\'s ours.</p>',"ok"));
    } else { fb.className="fb bad"; fb.textContent="✖ "+wrong+" letter"+(wrong>1?"s are":" is")+" still wrong (or blank). The lock won't say which."; }
  }
  $("#chk").onclick = chk;
}

/* ---- 5 · LOCKBREAKER ---- */
function stLock(){
  var L = P.lock, guess = [], MAX = 8, LOCK_S = 45;
  S.lockRound = S.lockRound||0; S.tries = S.tries||[];
  function name(g){ return V.AUREBESH[V.LETTERS.indexOf(g)]; }
  app.innerHTML =
    '<div class="kicker">TEST 5 OF 5 · FINAL INTERVIEW</div><h1>LOCKBREAKER</h1>'+
    comm("ALL FOUR OF US","WATCHING",
      '<div class="line"><span>ZORIN</span>A real Dataworx lock. Four slots, six possible glyphs, and no glyph used twice.</div>'+
      '<div class="line"><span>AN\'THO</span>Every attempt leaks a little. <b>●</b> means a glyph is right <i>and</i> in the right slot. <b>○</b> means right glyph, wrong slot. It won\'t tell you which glyph.</div>'+
      '<div class="line"><span>TAYLA</span>Eight tries, then it traces you and <b>slots 2 to 4 reshuffle</b>. Slot 1 never moves, and you already know what goes there!</div>'+
      '<div class="line"><span>I\'AN</span>No pressure, citizen.</div>')+
    intel()+
    '<div class="panel"><div class="meter"><span>TRACE IN <b id="left"></b></span><span>LOCK CYCLE <b id="cyc"></b></span></div>'+
    '<div class="slots" id="slots"></div><div class="pad" id="pad"></div>'+
    '<div class="row"><button class="ghost" id="clr">CLEAR</button><button id="go">SLICE ▸</button></div>'+
    '<div class="lockout" id="lo"></div><div class="fb" id="fb"></div>'+hintBlock("h")+
    '<button class="ghost full" id="hintBtn" style="margin-top:10px"></button></div>'+
    '<div class="panel"><h2>ATTEMPTS THIS CYCLE</h2><div class="tries" id="tries"></div></div><div id="after"></div>';
  $("#pad").innerHTML = L.set.map(function(g){ return '<button data-g="'+g+'"><span class="g">'+g+'</span><span class="l">'+name(g)+'</span></button>'; }).join("");
  function locked(){ return (S.lockUntil||0) > Date.now(); }
  function draw(){
    var sl = "";
    for (var i=0;i<4;i++){ var g=guess[i]; sl += '<div class="slot'+(i===guess.length?" next":"")+'"><div class="g">'+(g||"")+'</div><div class="l">'+(g?name(g):"SLOT "+(i+1))+'</div></div>'; }
    $("#slots").innerHTML = sl;
    [].forEach.call(document.querySelectorAll("#pad button"), function(b){ b.classList.toggle("used", guess.indexOf(b.dataset.g)>=0); });
    $("#left").textContent = MAX - S.tries.length; $("#cyc").textContent = S.lockRound+1;
    $("#tries").innerHTML = S.tries.length ? S.tries.slice().reverse().map(function(t){
      return '<div class="try"><span class="gs aur">'+t.g.join("")+'</span><span class="gl">'+t.g.map(name).join(" ")+'</span><span class="sc"><b>'+"●".repeat(t.locked)+'</b><i>'+"○".repeat(t.loose)+'</i>'+(t.locked+t.loose?"":"<span style=\'color:var(--muted)\'>none</span>")+'</span></div>';
    }).join("") : '<p class="note" style="margin:0">No attempts yet. Fill the four slots and slice.</p>';
    var lo = $("#lo");
    if (locked()){ lo.className="lockout on"; lo.textContent="⚠ TRACE DETECTED · REROUTING · "+Math.ceil((S.lockUntil-Date.now())/1000)+"s"; $("#go").disabled=true; }
    else { lo.className="lockout"; $("#go").disabled = guess.length<4 || !!S.solved.lock; }
  }
  [].forEach.call(document.querySelectorAll("#pad button"), function(b){
    b.onclick = function(){ var g=b.dataset.g; if (S.solved.lock) return; var i=guess.indexOf(g); if (i>=0) guess.splice(i,1); else if (guess.length<4) guess.push(g); draw(); };
  });
  $("#clr").onclick = function(){ guess=[]; draw(); };
  wireHints("lock", [
    'Start with what you know: put <b>'+name(L.first)+'</b> in slot 1. Then try three glyphs and watch the ● and ○ counts. Swap one glyph or one position at a time so you can tell what changed.',
    'Slot 2 this cycle is <b>'+name(V.lockCombo(P, S.lockRound)[1])+'</b>. (If the lock traces you, slots 2 to 4 reshuffle and this hint goes stale.)'
  ]);
  timers.push(setInterval(function(){ if (S.lockUntil) draw(); if (S.lockUntil && !locked()){ S.lockUntil=0; save(); draw(); } }, 500));
  $("#go").onclick = function(){
    if (guess.length<4 || locked()) return;
    var combo = V.lockCombo(P, S.lockRound), sc = V.scoreGuess(combo, guess), fb=$("#fb");
    S.tries.push({g:guess.slice(), locked:sc.locked, loose:sc.loose});
    guess = [];
    if (sc.locked===4){
      save(); draw(); $("#go").disabled=true; fb.className="fb ok"; fb.textContent="✔ LOCK SLICED";
      solvedAndNext("lock", comm("AN\'THO VOX","DATAWORX",'<p>Clean. Mostly.</p><p>That\'s all five. Open the channel.</p>',"ok"));
      return;
    }
    if (S.tries.length >= MAX){
      S.lockRound++; S.tries=[]; S.lockUntil = Date.now()+LOCK_S*1000;
      fb.className="fb bad"; fb.textContent="✖ Traced. Slots 2 to 4 have been reshuffled. Slot 1 still holds.";
      wireHints("lock", [
        'Start with what you know: put <b>'+name(L.first)+'</b> in slot 1. Then try three glyphs and watch the ● and ○ counts. Swap one glyph or one position at a time so you can tell what changed.',
        'Slot 2 this cycle is <b>'+name(V.lockCombo(P, S.lockRound)[1])+'</b>. (If the lock traces you, slots 2 to 4 reshuffle and this hint goes stale.)'
      ]);
    } else { fb.className="fb"; fb.textContent=""; }
    save(); draw();
  };
  draw();
}

/* ---- FINALE ---- */
function finale(){
  var mins = S.startedAt && S.finishedAt ? Math.max(1, Math.round((S.finishedAt-S.startedAt)/60000)) : null;
  var hints = 0; STAGES.forEach(function(s){ hints += S.hints[s]||0; });
  app.innerHTML =
    '<div class="granted fade"><div class="aur" style="margin-top:22px">ACCESS GRANTED</div><h1>ACCESS GRANTED</h1>'+
    '<p style="margin:4px 0 0;color:var(--muted);letter-spacing:.12em;font-size:13px">WELCOME TO THE CREW, RECRUIT</p></div>'+
    '<div class="codebox"><small>RECRUIT CODE</small><div class="code">'+P.code+'</div><div class="ser">CARD '+serial+'</div></div>'+
    '<p class="stamp">'+(mins?"CLEARED IN "+mins+" MIN · ":"")+hints+" HINT"+(hints===1?"":"S")+' USED</p>'+
    comm("REPORT TO HQ","",
      '<p>Bring <b>this screen and your recruit card</b> to <b>Vox Binary Dataworx HQ (Universal F3)</b>, or show them to any of the four of us. We check the code against your card, and it won\'t work with anybody else\'s.</p>'+
      '<p style="color:var(--muted);font-size:13px">Screenshot this screen, just in case. One reward per card.</p>')+
    comm("SIGN-OFF","DATAWORX",
      '<div class="line"><span>ZORIN</span>You gave it your best effort. That\'s all I ask of anyone.</div>'+
      '<div class="line"><span>AN\'THO</span>Clean work. Don\'t let it go to your head.</div>'+
      '<div class="line"><span>TAYLA</span>I <i>knew</i> you\'d make it!</div>'+
      '<div class="line"><span>I\'AN</span>Welcome aboard, citizen. The pay is terrible.</div>');
}

/* ---------- staff skip: hold the card chip ~2s ---------- */
(function(){
  var t=null, chip=$("#chip");
  function start(){ t=setTimeout(function(){
    if (!serial || !S || !STAGES.includes(S.stage)) return;
    var pin = prompt("Vox staff only. PIN to skip the current test:");
    if (pin && V.checkPin(pin)){ S.solved[S.stage]=Date.now(); S.staffSkip=(S.staffSkip||[]).concat([S.stage]); var i=STAGES.indexOf(S.stage); S.stage=STAGES[i+1]||"done"; if(S.stage==="done") S.finishedAt=Date.now(); save(); render(); window.scrollTo(0,0); }
  }, 2000); }
  function stop(){ clearTimeout(t); }
  chip.addEventListener("pointerdown", start); chip.addEventListener("pointerup", stop); chip.addEventListener("pointerleave", stop);
})();

/* ---------- boot ---------- */
function boot(){
  var raw = decodeURIComponent((location.hash||"").replace(/^#/,"")) || new URLSearchParams(location.search).get("r");
  var s = raw ? V.normSerial(raw) : null;
  if (raw && !s){ serial=null; S=null; render(); $("#fb").textContent="This card's serial didn't check out. Type it from the card."; return; }
  serial = s;
  if (!serial){ S=null; render(); return; }
  if (location.hash.replace(/^#/,"") !== serial) history.replaceState(null, "", location.pathname + location.search + "#" + serial);
  P = V.gen(serial);
  S = load("vox-recruit:"+serial) || { stage:"brief", solved:{}, hints:{} };
  S.solved = S.solved||{}; S.hints = S.hints||{};
  $("#chip").textContent = serial;
  render();
}
window.addEventListener("hashchange", function(){ boot(); window.scrollTo(0,0); });
boot();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
